name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDirectDebug :app:testDirectDebugUnitTest :app:assembleDirectDebug
      - uses: actions/upload-artifact@v4
        with:
          name: langlang-direct-debug
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
